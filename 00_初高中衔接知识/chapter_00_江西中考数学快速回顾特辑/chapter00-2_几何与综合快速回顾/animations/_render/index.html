    <script>
      (function () {
        function linkSceneTimelines(attempt) {
          var timelines = window.__timelines || {};
          var root = timelines.root;
          if (!root || root.__dgSceneTimelinesLinked) return;

          var hosts = Array.prototype.slice.call(
            document.querySelectorAll('.scene-host[data-composition-id][data-start][data-duration]')
          );
          if (!hosts.length) return;

          var missing = hosts.filter(function(host) {
            var id = host.getAttribute("data-composition-id");
            var timeline = timelines[id];
            return !timeline || timeline === root || typeof timeline.totalTime !== "function";
          });

          if (missing.length && attempt < 120) {
            window.setTimeout(function() { linkSceneTimelines(attempt + 1); }, 50);
            return;
          }

          root.set(hosts, { autoAlpha: 0 }, 0);
          hosts.forEach(function(host) {
            var id = host.getAttribute("data-composition-id");
            var start = parseFloat(host.getAttribute("data-start")) || 0;
            var duration = parseFloat(host.getAttribute("data-duration")) || 0;
            var timeline = timelines[id];

            root.set(host, { autoAlpha: 1 }, start);
            if (duration > 0) {
              root.set(host, { autoAlpha: 0 }, start + duration);
            }

            if (timeline && timeline !== root && typeof timeline.paused === "function") {
              timeline.pause(0);
              root.add(timeline, start);
              timeline.paused(false);
            }
          });

          root.__dgSceneTimelinesLinked = true;
        }

        linkSceneTimelines(0);
        window.addEventListener("load", function() { linkSceneTimelines(0); });
      })();
    </script>
